[protocol]
m = 64
blowup = 2
num_queries = 244

# CLI benchmark options override these settings. Fixed protocol values are checked.
[benchmark]
fields = ["goldilocks-quadratic", "f128-base"]
log_n_min = 20
log_n_max = 30
threads = [1, 32]
# Every configuration runs one full discarded warmup, then this many measured trials.
repetitions = 5
# Output root: writes BrakeFRI/goldilocks.csv and BrakeFRI/f128.csv beneath it.
# Filenames use base-field names only, without extension-profile suffixes.
output_dir = "results"
seed = 20260906
# Warmup and measured trials use separate fresh PCS/DFT instances.
# DFT cache construction is included in each measured commit.
# Optional per-case admission cap (MiB); also limited to 80% of available memory.
# max_memory_mib = 65536
# Optional child wall time limit, including setup, warmup, and every repetition.
# time_limit_seconds = 3600
